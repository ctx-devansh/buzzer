# Repo-level pytest config. Without it, `pytest tests/integration tests/e2e` (or
# `pytest tests`) falls back to tests/integration/pytest.ini as the rootdir, and
# tests/e2e/conftest.py — then outside the rootdir — gets applied to every test.
# Settings mirror tests/integration/pytest.ini, which still wins when that
# directory is run on its own.
#
# e2e must run LAST: Playwright's sync API leaves an event loop running on the main
# thread, and every async integration test after it fails with "cannot be called
# from a running event loop". testpaths order is collection order.
[pytest]
testpaths = tests/unit tests/integration tests/e2e
pythonpath = backend
asyncio_mode = auto
log_cli = true
log_cli_level = INFO
